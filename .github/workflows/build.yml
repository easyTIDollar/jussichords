name: Build & Release jussichords APK
run-name: release:${{ github.ref_name }}
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options:
          - release
          - canary
        default: release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      APP_VERSION: ''
    steps:
      # 拉取仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装 Java (已移除冲突的 cache: gradle)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 安装 Android SDK（直接用 runner 预装 SDK；
      # 新版镜像的 cmdline-tools 按版本目录存放且不在 PATH，用 find 定位后加入 GITHUB_PATH）
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' 2>/dev/null | sort | tail -1)"
          [ -n "$SM" ] || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using sdkmanager: $SM"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          yes | "$SM" --licenses >/dev/null 2>&1 || true

      # 安装 Android 平台工具
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # 配置 local.properties
      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # release 需要仓库内的 signing secrets；canary 用 keytool 现场生成测试密钥
      - name: Prepare release keystore
        if: env.BUILD_TYPE != 'canary'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets."
            echo "Required: RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      # 修复 Linux 无执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 验证 wrapper 是否损坏
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      # 安装 Gradle (完美处理缓存)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 从 build.gradle.kts 提取 versionName（release 的 tag 校验与 canary 的 tag 名都用它）
      - name: Extract app version
        shell: bash
        run: |
          APP_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$APP_VERSION" ]; then
            echo "Cannot find versionName"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "App version: $APP_VERSION"

      # 检查 tag 和 versionName 是否一致（仅 release tag push 时）
      - name: Validate tag matches app version
        if: env.BUILD_TYPE != 'canary' && github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          echo "App version: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag version does not match app version"
            exit 1
          fi

      # 构建 APK
      - name: Build release APK
        if: env.BUILD_TYPE != 'canary'
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build canary APK
        if: env.BUILD_TYPE == 'canary'
        run: |
          # 每次 canary 构建注入唯一版本后缀：UTC「年月日-时分秒」全日期时间戳尾号
          #（可读、唯一到秒、无竞态），保证 tag 永不冲突、可逐个追踪，且与 App 检查更新
          # 的 latestTag==VERSION_NAME 判断自洽（不同构建必提示、同构建不提示）。
          TS="$(date -u +%Y%m%d-%H%M%S)"
          SUFFIX="-canary.${TS}"
          echo "CANARY_VERSION_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${APP_VERSION}${SUFFIX}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=jussichords${SUFFIX}" >> "$GITHUB_ENV"
          ./gradlew assembleCanary --stacktrace --no-daemon "-PCANARY_VERSION_SUFFIX=$SUFFIX"

      # 验证 APK 签名
      - name: Verify APK signature
        shell: bash
        run: |
          APK=$(find "app/build/outputs/apk/$BUILD_TYPE" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found at $APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      # 重命名 APK
      - name: Rename APK
        shell: bash
        run: |
          APK=$(find "app/build/outputs/apk/$BUILD_TYPE" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          if [ "$BUILD_TYPE" = "canary" ]; then
            TARGET="jussichords-canary.apk"
            # RELEASE_TAG / RELEASE_NAME 已在 Build 步骤按唯一 run id 写入 GITHUB_ENV
          else
            TARGET="jussichords-${GITHUB_REF_NAME}.apk"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=jussichords-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
          mv "$APK" "app/build/outputs/apk/$BUILD_TYPE/$TARGET"
          echo "Generated: app/build/outputs/apk/$BUILD_TYPE/$TARGET"

      # 创建 GitHub Release（canary 为 pre-release）
      - name: Create GitHub Release
        if: env.BUILD_TYPE == 'canary'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/canary/jussichords-canary.apk
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: true
          body: |
            - Canary build for testing (v${{ env.APP_VERSION }}-canary)

      - name: Create GitHub Release
        if: env.BUILD_TYPE != 'canary'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/release/jussichords-${{ github.ref_name }}.apk
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          body: |
            - 新增播放状态上报：切歌生成 12 位会话 ID，进度与播放模式经 /relay/play/state/submit 上报
            - 最近播放页新增下拉刷新
            - 修复免费歌曲播放：unblock 失败/返回占位时回退不带 unblock 的主 API
            - 修复识别 NCM outer/url 占位外链，不再把反爬 HTML 当可播链接
            - 打卡（scrobble）被服务端拒绝/失败时 toast 提示
            - 默认 API 服务器改为 8.134.163.111:3000

      # 同步 release 到 Gitee（国内下载加速）：
      # 1) 删同名旧 release（仅 stable：固定 tag 重建会撞 Gitee「该标签已存在发行版」；
      #    canary tag 带时间戳、每次唯一，永不撞车，跳过删旧省一次全量 list 调用）
      # 2) 建 release（canary=pre-release，stable=正式）
      # 3) 上传 APK（Gitee 单文件上限 500MB；国内 CDN 下载快）
      - name: Push to Gitee
        # Gitee 只是国内镜像，主源是上一步已发布成功的 GitHub Release。
        # Gitee attach_files 大文件上传偶发 300s 超时，镜像同步失败不应让整个构建判红，
        # 故对本步骤整体 continue-on-error；App 端 Gitee 源已能自动跳过无 APK 的壳并回落到 GitHub。
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 同步。"
            exit 0
          fi
          OWNER="easyTIDollar"
          REPO="jussichords"
          BASE="https://gitee.com/api/v5/repos/${OWNER}/${REPO}"

          case "$BUILD_TYPE" in
            canary)
              APK="app/build/outputs/apk/canary/jussichords-canary.apk"
              PRERELEASE="true"
              BODY="- Gitee mirror of canary build (v${APP_VERSION}-canary)"
              ;;
            *)
              APK="app/build/outputs/apk/release/jussichords-${GITHUB_REF_NAME}.apk"
              PRERELEASE="false"
              BODY="- Gitee mirror of stable release (v${GITHUB_REF_NAME})"
              ;;
          esac
          echo "Gitee APK: $APK"
          [ -f "$APK" ] || { echo "APK not found: $APK"; exit 1; }

          # 1) 找同名旧 release 并删除（仅 stable：固定 tag 重建会撞车；
          #    canary tag 带时间戳唯一，跳过，省一次全量 list 调用 + 删除 + sleep 2）
          if [ "$BUILD_TYPE" != "canary" ]; then
            curl -fsS -H "Authorization: Bearer ***" \
              "${BASE}/releases?per_page=100&access_token=${GITEE_TOKEN}" -o /tmp/grels.json || true
            EXISTING_ID=$(RELEASE_TAG="$RELEASE_TAG" python3 -c '
            import json, os
            tag = os.environ.get("RELEASE_TAG", "").strip()
            try:
                rels = json.load(open("/tmp/grels.json"))
            except Exception:
                rels = []
            if isinstance(rels, dict):
                rels = []
            m = [str(r["id"]) for r in rels if r.get("tag_name") == tag]
            print(m[0] if m else "")
            ')
            if [ -n "$EXISTING_ID" ]; then
              echo "删除 Gitee 旧 release id=${EXISTING_ID}（tag=${RELEASE_TAG}）"
              curl -fsS -X DELETE -H "Authorization: Bearer ***" \
                "${BASE}/releases/${EXISTING_ID}?access_token=${GITEE_TOKEN}" -o /dev/null
              sleep 2
            fi
          fi

          # 2) 建 release（target_commitish=master；缺失 tag 会自动补）
          NEW_ID=$(curl -fsS -X POST -H "Authorization: Bearer ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BASE}/releases?access_token=${GITEE_TOKEN}" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"target_commitish\":\"master\",\"name\":\"${RELEASE_NAME}\",\"body\":\"$(printf '%s' "$BODY" | sed 's/"/\\"/g')\",\"prerelease\":${PRERELEASE}}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')
          echo "已建 Gitee release id=${NEW_ID} tag=${RELEASE_TAG}"
          [ -n "$NEW_ID" ] || { echo "Gitee 创建 release 未返回 id"; exit 1; }

          # 3) 上传 APK（access_token 走 query 参数；给足 300s 超时，带重试 + 退避）
          #    Gitee 大文件 attach_files 偶发 300s 无响应，重试 3 次（间隔 5/15s）。
          upload_ok=0
          for attempt in 1 2 3; do
            echo "Gitee 上传 APK（第 ${attempt} 次）..."
            if curl -fsS -m 300 -X POST \
              "${BASE}/releases/${NEW_ID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${APK}" -o /tmp/gattach.json 2>/tmp/gattach.err; then
              upload_ok=1
              break
            fi
            echo "上传失败：$(cat /tmp/gattach.err 2>/dev/null)"
            if [ "$attempt" -lt 3 ]; then
              sleep $([ "$attempt" = 1 ] && echo 5 || echo 15)
            fi
          done
          if [ "$upload_ok" = "1" ]; then
            python3 -c 'import json;d=json.load(open("/tmp/gattach.json"));print("已上传:",d.get("name"),d.get("size"),d.get("browser_download_url"))'
            echo "✅ Gitee: https://gitee.com/${OWNER}/${REPO}/releases/${RELEASE_TAG}"
          else
            echo "❌ Gitee APK 上传失败（重试后仍失败）。GitHub 主源不受影响；本步骤已 continue-on-error，不影响构建结果。"
          fi
