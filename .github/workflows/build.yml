name: Build & Release jussichords APK
run-name: release:${{ github.ref_name }}
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options:
          - release
          - canary
        default: release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      APP_VERSION: ''
    steps:
      # 拉取仓库（需要完整历史 + tag：更新说明按「上一个版本 → 本次构建」的提交差异生成）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 安装 Java (已移除冲突的 cache: gradle)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 安装 Android SDK（直接用 runner 预装 SDK；
      # 新版镜像的 cmdline-tools 按版本目录存放且不在 PATH，用 find 定位后加入 GITHUB_PATH）
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' 2>/dev/null | sort | tail -1)"
          [ -n "$SM" ] || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using sdkmanager: $SM"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          yes | "$SM" --licenses >/dev/null 2>&1 || true

      # 安装 Android 平台工具
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # 配置 local.properties
      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # release 需要仓库内的 signing secrets；canary 用 keytool 现场生成测试密钥
      - name: Prepare release keystore
        if: env.BUILD_TYPE != 'canary'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets."
            echo "Required: RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      # 修复 Linux 无执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 验证 wrapper 是否损坏
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      # 安装 Gradle (完美处理缓存)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 从 build.gradle.kts 提取 versionName（release 的 tag 校验与 canary 的 tag 名都用它）
      - name: Extract app version
        shell: bash
        run: |
          APP_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$APP_VERSION" ]; then
            echo "Cannot find versionName"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "App version: $APP_VERSION"

      # 检查 tag 和 versionName 是否一致（仅 release tag push 时）
      - name: Validate tag matches app version
        if: env.BUILD_TYPE != 'canary' && github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          echo "App version: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag version does not match app version"
            exit 1
          fi

      # 构建 APK
      - name: Build release APK
        if: env.BUILD_TYPE != 'canary'
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build canary APK
        if: env.BUILD_TYPE == 'canary'
        run: |
          # 每次 canary 构建注入唯一版本后缀：UTC「年月日-时分秒」全日期时间戳尾号
          #（可读、唯一到秒、无竞态），保证 tag 永不冲突、可逐个追踪，且与 App 检查更新
          # 的 latestTag==VERSION_NAME 判断自洽（不同构建必提示、同构建不提示）。
          TS="$(date -u +%Y%m%d-%H%M%S)"
          SUFFIX="-canary.${TS}"
          echo "CANARY_VERSION_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${APP_VERSION}${SUFFIX}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=jussichords${SUFFIX}" >> "$GITHUB_ENV"
          ./gradlew assembleCanary --stacktrace --no-daemon "-PCANARY_VERSION_SUFFIX=$SUFFIX"

      # 验证 APK 签名
      - name: Verify APK signature
        shell: bash
        run: |
          APK=$(find "app/build/outputs/apk/$BUILD_TYPE" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found at $APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      # 重命名 APK
      - name: Rename APK
        shell: bash
        run: |
          APK=$(find "app/build/outputs/apk/$BUILD_TYPE" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          if [ "$BUILD_TYPE" = "canary" ]; then
            TARGET="jussichords-canary.apk"
            # RELEASE_TAG / RELEASE_NAME 已在 Build 步骤按唯一 run id 写入 GITHUB_ENV
          else
            TARGET="jussichords-${GITHUB_REF_NAME}.apk"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=jussichords-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
          mv "$APK" "app/build/outputs/apk/$BUILD_TYPE/$TARGET"
          echo "Generated: app/build/outputs/apk/$BUILD_TYPE/$TARGET"

      # 生成更新说明（release notes）
      # 说明跟着代码走，不再是写死的一段旧文案：
      #   - canary：按「上一个 canary → 本次构建」的提交自动生成，每次发布的说明都对应这一版真实改动
      #   - 正式版：优先用 release-notes/<tag>.md（聊天定稿后写入仓库），没有则同样自动生成
      - name: Generate release notes
        shell: bash
        run: |
          if [ "$BUILD_TYPE" = "canary" ]; then
            python3 scripts/generate_release_notes.py \
              --out "$RUNNER_TEMP/release-notes.md" \
              --prefer canary
          else
            python3 scripts/generate_release_notes.py \
              --out "$RUNNER_TEMP/release-notes.md" \
              --override "release-notes/${GITHUB_REF_NAME}.md" \
              --prefer stable
          fi
          echo "RELEASE_NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      # 创建 GitHub Release（canary 为 pre-release）
      - name: Create GitHub Release
        if: env.BUILD_TYPE == 'canary'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/canary/jussichords-canary.apk
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: true
          # tag 必须指向本次构建的提交，否则下一个 canary 无法以上一个 tag 为 diff 基线
          target_commitish: ${{ github.sha }}
          body_path: ${{ env.RELEASE_NOTES_FILE }}

      # 清理旧的 canary release（只保留最新 2 个，release + tag 一起删），避免长期堆积垃圾。
      # 正式版 release 不受影响；App 内 canary 更新通道仍能看到最新 pre-release。
      - name: Cleanup old canary releases
        if: env.BUILD_TYPE == 'canary'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_CANARY_RELEASES: '2'
        run: |
          python3 scripts/cleanup_canary_releases.py

      - name: Create GitHub Release
        if: env.BUILD_TYPE != 'canary'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/release/jussichords-${{ github.ref_name }}.apk
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          body_path: ${{ env.RELEASE_NOTES_FILE }}

